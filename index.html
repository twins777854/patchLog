<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>patch//log — ゲームパッチノートまとめ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0f1219;
  --panel:#161b26;
  --panel-2:#1c2230;
  --border:#2a3040;
  --text:#e7e5df;
  --text-dim:#8b93a3;
  --text-faint:#565f70;
  --buff:#6fbf8b;
  --nerf:#e2704f;
  --change:#e0ab58;
  --new:#5fa8d3;
  --mono: 'IBM Plex Mono', monospace;
  --disp: 'Rajdhani', sans-serif;
}

*{box-sizing:border-box; overflow-wrap:anywhere;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.shell{
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"topbar" "main" "footer";
  min-height:100vh;
  padding-left:58px;
}
@media (max-width:820px){
  .shell{ padding-left:0; }
}

/* ---- header ---- */
.topbar{
  grid-area:topbar;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0;
  border-bottom:1px solid var(--border);
  background:#0f1219;
  position:relative;
  overflow:hidden;
}
.brand-panel{
  position:relative; display:flex; align-items:center; height:100%;
  padding:18px 40px 18px 28px;
  background:var(--buff);
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);
}
.brand{ display:flex; align-items:baseline; gap:10px; position:relative; z-index:1; }
.brand .mark{ font-family:var(--disp); font-weight:700; font-style:italic; font-size:22px; letter-spacing:0; color:#0b0d12; text-transform:uppercase; }
.brand .mark span{color:#0b0d12; opacity:0.55;}
.brand .tag{ font-size:10px; color:#0b0d12; opacity:0.65; letter-spacing:0.12em; font-weight:600; }
.topbar-right{ display:flex; align-items:center; gap:16px; padding-right:28px; }
.searchbox{
  display:flex; align-items:center; gap:8px;
  background:var(--panel-2); border:1px solid var(--border); border-radius:3px;
  padding:7px 12px; font-size:12px; color:var(--text-faint); min-width:200px;
}
.searchbox svg{flex:none;opacity:0.6;}

@media (max-width:600px){
  .brand-panel{ padding:14px 24px 14px 16px; clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%); }
  .brand .mark{ font-size:17px; }
  .brand .tag{ display:none; }
  .topbar-right{ padding-right:12px; gap:8px; }
  .searchbox{ min-width:0; padding:7px 9px; }
  .searchbox span{ display:none; }
}

/* ---- sidebar ---- */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; z-index:100; width:58px; overflow:hidden;
  border-right:1px solid var(--border); padding:18px 0; background:var(--panel);
  display:flex; flex-direction:column; transition:width .18s ease;
}
.sidebar:hover{ width:250px; box-shadow:12px 0 30px -10px rgba(0,0,0,0.6); }
.sidebar-label{ font-size:10px; letter-spacing:0.14em; color:var(--text-faint); padding:0 20px 10px; text-transform:uppercase; white-space:nowrap; opacity:0; transition:opacity .12s ease; }
.sidebar:hover .sidebar-label{ opacity:1; transition-delay:.08s; }
.game-list{ flex:1; }
.game-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;
  border-left:2px solid transparent; transition:background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.game-item:hover{background:var(--panel-2);}
.game-item.active{ background:var(--panel-2); border-left-color:var(--buff); }
.g-icon{
  width:30px;height:30px;border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
}
.game-item .g-text{ opacity:0; transition:opacity .12s ease; }
.sidebar:hover .game-item .g-text{ opacity:1; transition-delay:.08s; }
.game-item .g-name{ font-family:var(--disp); font-weight:600; font-size:14px; color:var(--text); }
.game-item .g-meta{ font-size:10.5px; color:var(--text-faint); margin-top:2px; }

.add-game-wrap{ padding:14px 20px 4px; border-top:1px solid var(--border); margin-top:10px; opacity:0; transition:opacity .12s ease; }
.sidebar:hover .add-game-wrap{ opacity:1; transition-delay:.08s; }
.add-game-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
  border:1px dashed var(--border); background:none; color:var(--text-dim);
  font-family:var(--mono); font-size:12px; padding:9px; border-radius:3px; cursor:pointer;
  white-space:nowrap;
}
.add-game-btn:hover{ border-color:var(--new); color:var(--text); }
.add-game-form{ display:none; flex-direction:column; gap:8px; margin-top:10px; }
.add-game-form.open{ display:flex; }
.add-game-form input{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:12px; padding:8px 10px; border-radius:6px; outline:none;
}
.add-game-form input:focus{ border-color:var(--new); }
.add-game-form .row{ display:flex; gap:8px; }
.add-game-form button{
  font-family:var(--mono); font-size:11.5px; padding:7px 10px; border-radius:6px; cursor:pointer; border:none;
}
.add-game-form .submit{ background:var(--buff); color:#0f1219; font-weight:600; flex:1; }
.add-game-form .cancel{ background:none; color:var(--text-faint); border:1px solid var(--border); }

@media (max-width:820px){
  .sidebar{ position:static; width:100%; padding:12px 0; }
  .sidebar:hover{ width:100%; box-shadow:none; }
  .sidebar-label,.game-item .g-text,.add-game-wrap{ opacity:1; }
  .game-list{ display:flex; overflow-x:auto; padding:0 12px; }
  .sidebar-label{display:none;}
  .game-item{ flex:none; border-left:none; border-bottom:2px solid transparent; padding:8px 12px; }
  .game-item.active{border-bottom-color:var(--buff);}
  .game-item .g-meta{display:none;}
  .add-game-wrap{ border-top:none; margin-top:0; padding:10px 12px; }
}

/* ---- main ---- */
main{grid-area:main; padding:32px 48px 60px; max-width:1300px; margin:0 auto; width:100%;}
#detailArea{ max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
@media (max-width:600px){ main{padding:22px 18px 48px;} }

.game-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
.game-head .g-icon-lg{
  width:40px;height:40px;border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
}
.game-head h1{ font-family:var(--disp); font-size:26px; margin:0; letter-spacing:-0.01em; flex:1; }
.latest-badge{
  font-family:var(--mono); font-size:11px; color:var(--bg); background:var(--buff);
  padding:4px 10px; border-radius:0; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.latest-badge.empty{ background:var(--panel-2); color:var(--text-faint); border:1px solid var(--border); }
.game-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:22px; }

/* roster */
.roster-label{ font-size:10px; letter-spacing:0.12em; color:var(--text-faint); text-transform:uppercase; margin-bottom:10px; }

.section-toggle{ display:inline-flex; background:var(--panel); border:1px solid var(--border); padding:0; margin-bottom:24px; gap:2px; }
.sec-tab{
  font-family:var(--disp); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
  padding:9px 24px; border:none; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
  background:var(--panel-2); color:var(--text-faint); cursor:pointer; transition:background .15s ease, color .15s ease;
}
.sec-tab:hover{ color:var(--text-dim); }
.sec-tab.active{ background:var(--game-color,var(--buff)); color:#0b0d12; }
.roster{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
.roster-chip{
  display:flex; flex-direction:row; align-items:center; gap:10px;
  background:#161822; border:none; border-left:4px solid var(--border);
  padding:9px 12px; cursor:pointer; text-align:left;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.roster-chip:hover{ background:#1c1f2c; }
.roster-chip.active{ border-left-color:var(--game-color,var(--buff)); background:#1c1f2c; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06); }
.roster-chip.all{ justify-content:center; }
.roster-chip.all.active{ border-left-color:var(--new); }
.avatar{
  width:26px;height:26px;border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp); font-weight:700; font-size:11px; color:#0f1219;
}
.roster-chip .r-name{ font-size:13px; color:var(--text); font-weight:700; line-height:1.25; text-transform:uppercase; letter-spacing:0.01em; }
.roster-chip .r-role{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; }

/* strength meter */
.meter-track{
  width:56px; height:6px; border-radius:1px; background:var(--border);
  position:relative; flex:none;
}
.meter-track::before{
  content:''; position:absolute; left:50%; top:-2px; width:1px; height:10px;
  background:var(--text-faint); transform:translateX(-0.5px);
}
.meter-fill{ position:absolute; top:0; height:100%; }
.meter-fill.buff{ left:50%; background:var(--buff); }
.meter-fill.nerf{ right:50%; background:var(--nerf); }
.meter-fill.m1{ width:8px; }
.meter-fill.m2{ width:18px; }
.meter-fill.m3{ width:28px; }
.meter-dot{
  width:56px; height:6px; display:flex; align-items:center; justify-content:center; flex:none;
}
.meter-dot span{ width:6px; height:6px; border-radius:1px; }

/* character detail view */
.char-head{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.char-head .avatar{ width:44px; height:44px; font-size:16px; }
.char-head h2{ font-family:var(--disp); font-size:20px; margin:0; }
.char-head .role{ font-size:11.5px; color:var(--text-dim); }
.char-summary{ font-size:11.5px; color:var(--text-faint); margin:8px 0 24px; }
.char-summary b.b{color:var(--buff);} .char-summary b.n{color:var(--nerf);}
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim);
  cursor:pointer; margin-bottom:18px; border:none; background:none; padding:0; font-family:var(--mono);
}
.back-link:hover{ color:var(--text); }

.ability-block{ margin-bottom:26px; }
.ability-block-label{ font-size:10px; letter-spacing:0.12em; color:var(--text-faint); text-transform:uppercase; margin-bottom:10px; }
.ability-row{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
.ability-row:last-child{ border-bottom:none; }
.ability-tag{
  flex:none; width:88px; font-size:10px; padding:3px 8px; border-radius:4px; text-align:center;
  font-weight:600; letter-spacing:0.02em;
}
.ability-tag.passive{ background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); }
.ability-tag.tactical{ background:var(--new)22; color:var(--new); }
.ability-tag.ultimate{ background:var(--change)22; color:var(--change); }
.ability-tag.mod{ font-size:13px; font-weight:700; padding:5px 10px; letter-spacing:0.03em; }
.ability-name{ font-family:var(--disp); font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px; }
.ability-desc{ font-size:12px; color:var(--text-dim); line-height:1.6; }

.perk-tier{ margin-bottom:14px; }
.perk-tier-label{ font-family:var(--disp); font-size:11px; font-weight:700; color:var(--text-dim); margin-bottom:8px; letter-spacing:0.04em; }
.perk-opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:560px){ .perk-opts{ grid-template-columns:1fr; } }
.perk-opt{ background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:10px 12px; }
.perk-name{ font-family:var(--disp); font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:4px; }
.perk-desc{ font-size:11.5px; color:var(--text-dim); line-height:1.55; }

.char-entry{
  display:flex; align-items:flex-start; gap:14px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.char-entry:last-child{ border-bottom:none; }
.char-entry .cev{ font-size:11px; color:var(--text-faint); width:78px; flex:none; }
.char-entry .cev .cver{ font-family:var(--disp); font-weight:700; color:var(--text); font-size:12.5px; display:block; }
.char-entry .ctext{ font-size:13px; color:#d3d1cb; flex:1; line-height:1.6; min-width:0; overflow-wrap:anywhere; word-break:break-word; }

/* timeline view (all changes) */
.filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; }
.chip{
  font-size:11px; padding:5px 10px; border-radius:5px; border:1px solid var(--border);
  color:var(--text-dim); display:flex; align-items:center; gap:6px; cursor:default;
}
.chip .sw{width:7px;height:7px;border-radius:2px;}

.entry{ border-left:1px solid var(--border); padding-left:22px; margin-left:5px; padding-bottom:30px; position:relative; }
.entry:last-child{padding-bottom:0;}
.entry::before{
  content:''; position:absolute; left:-5.5px; top:3px; width:10px;height:10px;
  border-radius:50%; background:var(--bg); border:2px solid var(--buff);
}
.entry-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.ver{ font-family:var(--disp); font-weight:700; font-size:16px; color:var(--text); }
.date{ font-size:11.5px; color:var(--text-faint); }
.entry-title{ font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }
.diff-line{ display:flex; align-items:center; gap:12px; font-size:13px; line-height:1.5; padding:5px 0; }
.diff-sym{ font-weight:600; flex:none; width:14px; text-align:center; }
.diff-line.buff .diff-sym{color:var(--buff);}
.diff-line.nerf .diff-sym{color:var(--nerf);}
.diff-line.change .diff-sym{color:var(--change);}
.diff-line.new .diff-sym{color:var(--new);}
.diff-line.fix .diff-sym{color:var(--new);}
.diff-line .body{color:#d3d1cb; flex:1; min-width:0; overflow-wrap:anywhere; word-break:break-word;}
.diff-line .target{color:var(--text);font-weight:600;}

.empty-state{
  border:1px dashed var(--border); border-radius:3px; padding:28px 22px; text-align:center;
  color:var(--text-faint); font-size:12.5px; line-height:1.7;
}

/* events */
.event-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:28px; }
.event-card{ background:var(--panel); border:1px solid var(--border); overflow:hidden; }
.event-banner{ height:72px; position:relative; display:flex; align-items:center; justify-content:center; }
.event-icon{ width:40px; height:40px; background:rgba(255,255,255,0.15) !important; border-radius:50%; }
.event-live{
  position:absolute; top:8px; right:8px; background:#0b0d12; color:#fff; font-family:var(--disp);
  font-weight:700; font-size:10px; padding:2px 8px; letter-spacing:0.04em; text-transform:uppercase;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.event-body{ padding:12px 14px 14px; }
.event-kind{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
.event-name{ font-family:var(--disp); font-weight:700; font-size:15px; color:var(--text); margin-bottom:4px; line-height:1.25; }
.event-period{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-bottom:8px; }
.event-desc{ font-size:12px; color:var(--text-dim); line-height:1.6; }
.event-card{ text-decoration:none; display:block; transition:border-color .15s ease, transform .15s ease; cursor:default; }
a.event-card{ cursor:pointer; }
a.event-card:hover{ border-color:var(--text-faint); transform:translateY(-2px); }
.event-link{ margin-top:10px; font-size:11px; font-weight:700; color:var(--new); }

/* returning-player summary */
.summary-select{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  font-family:var(--disp); font-weight:700; font-size:14px; padding:9px 14px;
  border-radius:0; cursor:pointer; margin-bottom:14px;
}
.summary-lead{ font-size:13px; color:var(--text-dim); line-height:1.7; max-width:620px; }
.summary-lead b{ color:var(--text); }

.sum-headlines{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
.sum-headline{ display:flex; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
.sum-hl-ver{ font-family:var(--disp); font-weight:700; color:var(--text); flex:none; width:120px; }
.sum-hl-date{ font-family:var(--mono); color:var(--text-faint); flex:none; width:90px; }
.sum-hl-title{ color:var(--text-dim); flex:1; min-width:0; overflow-wrap:anywhere; word-break:break-word; }

.sum-events{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.sum-event{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-dim); }
.sum-event-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.sum-event-name{ color:var(--text); font-weight:600; }
.sum-event-date{ font-family:var(--mono); color:var(--text-faint); font-size:11px; }

.sum-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:10px; }
.sum-chip{ background:var(--panel); border:1px solid var(--border); padding:10px 12px; }
.sum-name{ font-family:var(--disp); font-weight:700; font-size:13px; color:var(--text); margin-bottom:6px; }
.sum-counts{ display:flex; gap:6px; margin-bottom:6px; }
.sc{ font-family:var(--mono); font-size:11px; font-weight:700; padding:1px 6px; }
.sc.buff{ color:var(--buff); background:var(--buff)1a; }
.sc.nerf{ color:var(--nerf); background:var(--nerf)1a; }
.sc.change{ color:var(--change); background:var(--change)1a; }
.sc.new{ color:var(--new); background:var(--new)1a; }
.sum-last{ font-size:11px; color:var(--text-faint); line-height:1.5; }

footer{ grid-area:footer; border-top:1px solid var(--border); padding:20px 40px 32px; font-size:11px; color:var(--text-faint); }
@media (max-width:600px){ footer{padding:18px;} }

/* class / weapon-type filter — hover flyout, inline next to roster label */
.roster-header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.roster-header .roster-label{ margin-bottom:0; }
.filter-flyout{ position:relative; display:inline-flex; }
.filter-trigger{
  display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:3px;
  border:1px solid var(--border); background:var(--panel); color:var(--text-dim);
  font-family:var(--mono); font-size:11px; cursor:pointer;
}
.filter-trigger .car{ font-size:9px; color:var(--text-faint); transition:transform .15s ease; }
.filter-flyout.has-sel .filter-trigger{ border-color:var(--tab-color,var(--buff)); color:var(--text); }
.filter-trigger.primary{
  font-family:var(--disp); font-weight:700; font-size:14px; color:var(--text); text-transform:uppercase; letter-spacing:0.02em;
  padding:9px 18px 9px 14px; background:var(--panel-2); border-radius:0;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
}
.filter-flyout.primary.has-sel .filter-trigger.primary{ background:var(--tab-color,var(--buff)); color:#0b0d12; border-color:transparent; }
.filter-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:30;
  display:none; flex-direction:column; gap:6px; min-width:190px;
  background:var(--panel); border:1px solid var(--border); border-radius:3px;
  padding:10px; box-shadow:0 12px 28px -8px rgba(0,0,0,0.55);
}
.filter-flyout:hover .filter-panel,
.filter-flyout:focus-within .filter-panel,
.filter-flyout.open .filter-panel{ display:flex; }
.filter-panel.grid{
  display:none; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px;
  min-width:340px; max-width:min(560px, 88vw); max-height:60vh; overflow-y:auto;
}
.filter-flyout:hover .filter-panel.grid,
.filter-flyout:focus-within .filter-panel.grid,
.filter-flyout.open .filter-panel.grid{ display:grid; }
.filter-panel.grid .roster-chip{ margin:0; }
.filter-trigger .car{ font-size:9px; color:var(--text-faint); transition:transform .15s ease; }
.filter-flyout:hover .filter-trigger .car,
.filter-flyout:focus-within .filter-trigger .car,
.filter-flyout.open .filter-trigger .car{ transform:rotate(180deg); }
@media (max-width:600px){

function meterHtml(line){
  if(line.t==="buff" || line.t==="nerf"){
    const mag = line.mag||1;
    return `<div class="meter-track"><div class="meter-fill ${line.t} m${mag}"></div></div>`;
  }
  const color = line.t==="change" ? "var(--change)" : "var(--new)";
  return `<div class="meter-dot"><span style="background:${color}"></span></div>`;
}

function renderTimeline(patches){
  const filters = ['buff','nerf','change','new'].map(t=>{
    const c = {buff:'var(--buff)',nerf:'var(--nerf)',change:'var(--change)',new:'var(--new)'}[t];
    return `<div class="chip"><span class="sw" style="background:${c}"></span>${LABEL[t]}</div>`;
  }).join('');

  const entries = patches.map(p=>{
    const lines = p.lines.map(l=>{
      const sym = SYM[l.t];
      const targetHtml = l.target ? `<span class="target">${l.target}</span> — ` : '';
      return `<div class="diff-line ${l.t}"><span class="diff-sym">${sym}</span><span class="body">${targetHtml}${l.text}</span>${meterHtml(l)}</div>`;
    }).join('');
    return `
      <div class="entry">
        <div class="entry-head"><span class="ver">${p.ver}</span><span class="date">${p.date}</span></div>
        ${p.title ? `<div class="entry-title">${p.title}</div>` : ''}
        ${lines}
      </div>`;
  }).join('');

  return `<div class="filters">${filters}</div>${entries}`;
}

function renderWeaponDetail(g, wid){
  const w = g.weapons.find(x=>x.id===wid);
  const changes = [];
  g.weaponPatches.forEach(p=>{
    p.lines.forEach(l=>{
      if(l.wid===wid) changes.push({...l, ver:p.ver, date:p.date});
    });
  });
  const buffs = changes.filter(c=>c.t==="buff").length;
  const nerfs = changes.filter(c=>c.t==="nerf").length;

  const rows = changes.map(c=>{
    const sym = SYM[c.t];
    return `
      <div class="char-entry">
        <div class="cev"><span class="cver">${c.ver}</span>${c.date}</div>
        ${meterHtml(c)}
        <div class="ctext"><span class="diff-sym" style="display:inline;width:auto;margin-right:4px;" >${sym}</span>${c.text}</div>
      </div>`;
  }).join('');

  const hopupHtml = w.hopup
    ? `<div class="ability-block"><div class="ability-block-label">対応ホップアップ</div>

      </div>`
    : `<div class="char-summary">この武器に専用ホップアップはありません。</div>`;

  return `
    <button class="back-link" id="backWeaponBtn">← すべての変更履歴に戻る</button>
    <div class="char-head">
      ${weaponAvatarHtml(w.category, 44)}

    ${rows || '<div class="char-summary">この武器の変更履歴はまだありません。</div>'}
  `;
}

    const color = WEAPON_CAT_COLORS[cat];
    const active = catSel===cat ? ' active' : '';
    const gen = WEAPON_CAT_ICONS[cat];
    return `
      <div class="class-tab${active}" data-cat="${cat}" style="--tab-color:${color}">
        <div class="ct-icon" style="background:${color}22">${gen(color,16)}</div>
        <div class="ct-label">${cat}</div>
        <div class="ct-count">${count}</div>
      </div>`;
  }).join('');
  return `<div class="class-row">${allTab}${tabs}</div>`;
}

function perksHtml(r){
  if(!r.perks) return '';
  const tiers = r.perks.map(tier=>{
    const opts = tier.options.map(o=>`
      <div class="perk-opt">
        <div class="perk-name">${o.name}</div>
        <div class="perk-desc">${o.desc}</div>
      </div>`).join('');
    return `
      <div class="perk-tier">
        <div class="perk-tier-label">${tier.tier}</div>
        <div class="perk-opts">${opts}</div>
      </div>`;
  }).join('');
  return `
    <div class="ability-block">
      <div class="ability-block-label">現在のパーク（レジェンドアップグレード）</div>
      ${tiers}
    </div>`;
}

function abilitiesHtml(r){
  if(!r.passives) return '';
  const passiveRows = r.passives.map(p=>`
    <div class="ability-row">
      <span class="ability-tag passive">パッシブ</span>
      <div><div class="ability-name">${p.name}</div><div class="ability-desc">${p.desc}</div></div>
    </div>`).join('');
  const tacticalRow = `
    <div class="ability-row">
      <span class="ability-tag tactical">戦術</span>
      <div><div class="ability-name">${r.tactical.name}</div><div class="ability-desc">${r.tactical.desc}</div></div>
    </div>`;
  const ultimateRow = `
    <div class="ability-row">
      <span class="ability-tag ultimate">アルティメット</span>
      <div><div class="ability-name">${r.ultimate.name}</div><div class="ability-desc">${r.ultimate.desc}</div></div>
    </div>`;
  return `
    <div class="ability-block">
      <div class="ability-block-label">現在のアビリティ</div>
      ${passiveRows}${tacticalRow}${ultimateRow}
    </div>`;
}

function renderCharView(g, rid){
  const r = g.roster.find(x=>x.id===rid);
  const changes = [];
  g.patches.forEach(p=>{
    p.lines.forEach(l=>{
      if(l.rid===rid) changes.push({...l, ver:p.ver, date:p.date});
    });
  });
  const buffs = changes.filter(c=>c.t==="buff").length;
  const nerfs = changes.filter(c=>c.t==="nerf").length;

  const rows = changes.map(c=>{
    const sym = SYM[c.t];
    return `
      <div class="char-entry">
        <div class="cev"><span class="cver">${c.ver}</span>${c.date}</div>
        ${meterHtml(c)}
        <div class="ctext"><span class="diff-sym" style="display:inline;width:auto;margin-right:4px;" >${sym}</span>${c.text}</div>
      </div>`;
  }).join('');

  return `
    <button class="back-link" id="backBtn">← すべての変更履歴に戻る</button>
    <div class="char-head">
      ${classAvatarHtml(r.role, 44)}
      <div>
        <h2>${r.name}</h2>
        <div class="role">${r.role}</div>
      </div>
    </div>
    ${abilitiesHtml(r)}
    ${perksHtml(r)}
    <div class="char-summary">この1年の変更: <b class="b">${buffs}件のバフ</b> / <b class="n">${nerfs}件のナーフ</b>（バーの伸びが大きいほど変化幅が大きいことを示します）</div>
    ${rows || '<div class="char-summary">このキャラクターの変更履歴はまだありません。</div>'}
  `;
}

function classTabsHtml(g){
  if(g.roster.length===0) return '';
  const rolesPresent = [...new Set(g.roster.map(r=>r.role))];
  if(rolesPresent.length<2) return '';
  const ordered = CLASS_ORDER.filter(c=>rolesPresent.includes(c)).concat(rolesPresent.filter(c=>!CLASS_ORDER.includes(c)));
  const sel = selectedClass[current];
  const allActive = !sel ? ' active' : '';
  const allTab = `
    <div class="class-tab all${allActive}" data-role="" style="--tab-color:${g.color}">
      <div class="ct-icon" style="background:${g.color}22">${ICONS[g.icon](g.color)}</div>
      <div class="ct-label">すべて</div>
      <div class="ct-count">${g.roster.length}</div>
    </div>`;
  const tabs = ordered.map(role=>{
    const count = g.roster.filter(r=>r.role===role).length;
    const color = CLASS_COLORS[role] || g.color;
    const active = sel===role ? ' active' : '';
    const gen = CLASS_ICONS[role] || CLASS_ICONS["アサルト"];
    return `
      <div class="class-tab${active}" data-role="${role}" style="--tab-color:${color}">
        <div class="ct-icon" style="background:${color}22">${gen(color,16)}</div>
        <div class="ct-label">${role}</div>
        <div class="ct-count">${count}</div>
      </div>`;
  }).join('');
  return `<div class="class-row">${allTab}${tabs}</div>`;
}

function isEventCurrent(e){
  if(!e.start) return false;
  const today = new Date();
  const start = new Date(e.start);
  const end = e.end ? new Date(e.end) : new Date(start.getTime() + 14*24*60*60*1000); // 終了日不明なら開始から2週間を目安にする
  return today >= start && today <= end;
}

function renderEvents(g){
  const events = g.events || [];
  const current_ = events.filter(isEventCurrent);
  const past = events.filter(e => !isEventCurrent(e));

  function cardHtml(e){
    const live = isEventCurrent(e);
    const color = e.color || '#8b93a3';
    const icon = e.icon || 'orbit';
    const period = e.end ? `${e.start} 〜 ${e.end}` : `${e.start} 〜`;
    const url = e.url || e.source || '';
    const tag = url ? 'a' : 'div';
    const linkAttrs = url ? `href="${url}" target="_blank" rel="noopener"` : '';
    return `
      <${tag} class="event-card" ${linkAttrs}>
        <div class="event-banner" style="background:linear-gradient(135deg, ${color}, ${color}55)">
          ${iconHtml(icon, '#ffffff', 'event-icon')}
          ${live ? '<span class="event-live">開催中</span>' : ''}
        </div>
        <div class="event-body">
          <div class="event-kind" style="color:${color}">${e.kind || ''}</div>
          <div class="event-name">${e.name}</div>
          <div class="event-period">${period}</div>
          <div class="event-desc">${e.desc || ''}</div>
          ${url ? '<div class="event-link">詳細を見る ↗</div>' : ''}
        </div>
      </${tag}>`;
  }

  return `
    ${current_.length ? `
      <div class="roster-label">開催中のイベント</div>
      <div class="event-grid">${current_.map(cardHtml).join('')}</div>
    ` : ''}
    <div class="roster-label" style="margin-top:${current_.length?'8px':'0'}">過去のイベント</div>
    <div class="event-grid">${past.map(cardHtml).join('')}</div>
  `;
}

let selectedSummaryMonth = {};

function monthLabel(ym){
  const [y,m] = ym.split('-');
  return `${y}年${parseInt(m,10)}月〜`;
}

function renderSummary(g){
  const allPatches = [...(g.patches||[]), ...(g.weaponPatches||[])];
  const dates = allPatches.map(p=>p.date).filter(Boolean).sort();
  if(dates.length===0){
    return `<div class="empty-state">まとめを作るためのパッチ履歴がまだありません。</div>`;
  }

  const months = [...new Set(dates.map(d=>d.slice(0,7)))].sort();
  let sel = selectedSummaryMonth[current];
  if(!sel || !months.includes(sel)) sel = months[0];
  selectedSummaryMonth[current] = sel;

  const cutoff = new Date(sel + '-01');
  const now = new Date();
  const monthsAway = Math.max(1, Math.round((now - cutoff) / (30*24*60*60*1000)));

  const relevant = allPatches
    .filter(p => p.date && new Date(p.date) >= cutoff)
    .sort((a,b) => a.date.localeCompare(b.date));

  const agg = {};
  relevant.forEach(p=>{
    (p.lines||[]).forEach(l=>{
      if(!l.target) return;
      if(!agg[l.target]) agg[l.target] = {buff:0,nerf:0,change:0,new:0,lastText:'',lastDate:''};
      if(agg[l.target][l.t] !== undefined) agg[l.target][l.t]++;
      if(!agg[l.target].lastDate || p.date >= agg[l.target].lastDate){
        agg[l.target].lastText = l.text;
        agg[l.target].lastDate = p.date;
      }
    });
  });
  const aggList = Object.entries(agg)
    .map(([name,v]) => ({name, ...v, total: v.buff+v.nerf+v.change+v.new}))
    .sort((a,b) => b.total - a.total)
    .slice(0, 16);

  const headlines = relevant.filter(p => p.title);
  const relevantEvents = (g.events||[]).filter(e => e.start && new Date(e.start) >= cutoff);

  const monthOptions = months.map(m =>
    `<option value="${m}"${m===sel?' selected':''}>${monthLabel(m)}</option>`
  ).join('');

  const aggHtml = aggList.map(a => `
    <div class="sum-chip">
      <div class="sum-name">${a.name}</div>
      <div class="sum-counts">
        ${a.buff ? `<span class="sc buff">+${a.buff}</span>` : ''}
        ${a.nerf ? `<span class="sc nerf">-${a.nerf}</span>` : ''}
        ${a.change ? `<span class="sc change">~${a.change}</span>` : ''}
        ${a.new ? `<span class="sc new">*${a.new}</span>` : ''}
      </div>
      <div class="sum-last">${a.lastText}</div>
    </div>`).join('');

  const headlineHtml = headlines.map(p => `
    <div class="sum-headline">
      <span class="sum-hl-ver">${p.ver}</span>
      <span class="sum-hl-date">${p.date}</span>
      <span class="sum-hl-title">${p.title}</span>
    </div>`).join('');

  const eventsHtml = relevantEvents.map(e => `
    <div class="sum-event">
      <span class="sum-event-dot" style="background:${e.color||'#8b93a3'}"></span>
      <span class="sum-event-name">${e.name}</span>
      <span class="sum-event-date">${e.start}</span>
    </div>`).join('');

  return `
    <div class="summary-intro">
      <div class="roster-label">いつ頃までプレイしていましたか？</div>
      <select id="summaryMonthSelect" class="summary-select">${monthOptions}</select>
      <p class="summary-lead">約${monthsAway}ヶ月ぶりの復帰、おつかれさまです。それ以降、<b>${relevant.length}件のアップデート</b>がありました。ざっくり何が変わったか、下にまとめています。</p>
    </div>

    ${headlineHtml ? `
      <div class="roster-label" style="margin-top:24px">主なアップデート</div>
      <div class="sum-headlines">${headlineHtml}</div>
    ` : ''}

    ${eventsHtml ? `
      <div class="roster-label" style="margin-top:24px">あった主なイベント</div>
      <div class="sum-events">${eventsHtml}</div>
    ` : ''}

    <div class="roster-label" style="margin-top:24px">キャラ・武器ごとの変化（変更が多い順）</div>
    <div class="sum-grid">${aggHtml || '<div class="char-summary">この期間中の個別の変更はありませんでした。</div>'}</div>
  `;
}

function renderMain(){
  const g = DATA[current];
  const main = document.getElementById('main');
  const hasWeapons = g.weapons && g.weapons.length>0;
  const hasEvents = g.events && g.events.length>0;
  const tab = activeTab[current] || 'legends';
  const sel = selectedChar[current];
  const wsel = selectedWeapon[current];
  const hasPatches = g.patches.length > 0;

  const badge = hasPatches
    ? `<span class="latest-badge">最新 ${g.patches[0].ver}</span>`
    : `<span class="latest-badge empty">データ未登録</span>`;

  let body;
  if(tab==='summary'){
    body = renderSummary(g);
  } else if(tab==='events'){
    body = renderEvents(g);
  } else if(tab==='weapons'){
    body = `${renderWeaponRoster(g)}<div id="detailArea">${ wsel ? renderWeaponDetail(g, wsel) : renderTimeline(g.weaponPatches) }</div>`;
  } else if(!hasPatches){
    body = `<div class="empty-state">まだパッチノートが登録されていません。<br>キャラクター一覧やバージョン履歴を追加すると、他のタイトルと同じ形式で表示されます。</div>`;
  } else {
    body = `${renderRoster(g)}<div id="detailArea">${ sel ? renderCharView(g, sel) : renderTimeline(g.patches) }</div>`;
  }

  main.innerHTML = `
    <div class="game-head">
      ${iconHtml(g.icon, g.color, 'g-icon-lg')}
      <h1>${g.name}</h1>
      ${badge}
    </div>
    <div class="game-sub">${g.tagline || '追加されたタイトル'}</div>
    ${sectionTabsHtml(g)}
    ${body}
  `;

  if(tab==='weapons'){
    main.querySelectorAll('.class-tab').forEach(el=>{
      el.addEventListener('click', ()=>{
        const cat = el.getAttribute('data-cat');
        selectedWeaponCat[current] = cat || null;
        selectedWeapon[current] = null;
        renderMain();
      });
    });
  } else {
    main.querySelectorAll('.class-tab').forEach(el=>{
      el.addEventListener('click', ()=>{
        const role = el.getAttribute('data-role');
        selectedClass[current] = role || null;
        selectedChar[current] = null;
        renderMain();
      });
    });
  }

  main.querySelectorAll('.sec-tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeTab[current] = el.getAttribute('data-sec');
      renderMain();
    });
  });

  const monthSel = document.getElementById('summaryMonthSelect');
  if(monthSel){
    monthSel.addEventListener('change', ()=>{
      selectedSummaryMonth[current] = monthSel.value;
      renderMain();
    });
  }

  // タップでも開閉できるようにする(ホバーが使えないスマホ向け)
  main.querySelectorAll('.filter-flyout').forEach(fly=>{
    const trigger = fly.querySelector('.filter-trigger');
    if(!trigger) return;
    trigger.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const willOpen = !fly.classList.contains('open');
      main.querySelectorAll('.filter-flyout.open').forEach(o=>{ if(o!==fly) o.classList.remove('open'); });
      fly.classList.toggle('open', willOpen);
    });
  });

  main.querySelectorAll('.roster-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(tab==='weapons'){
        const wid = el.getAttribute('data-wid');
        selectedWeapon[current] = wid || null;
      } else {
        const rid = el.getAttribute('data-rid');
        selectedChar[current] = rid || null;
      }
      renderMain();
    });
  });
  const back = document.getElementById('backBtn');
  if(back){ back.addEventListener('click', ()=>{ selectedChar[current]=null; renderMain(); }); }
  const backW = document.getElementById('backWeaponBtn');
  if(backW){ backW.addEventListener('click', ()=>{ selectedWeapon[current]=null; renderMain(); }); }
}

function render(){
  renderSidebar();
  renderMain();
  const panel = document.querySelector('.brand-panel');
  if(panel) panel.style.background = DATA[current].color;
  document.documentElement.style.setProperty('--game-color', DATA[current].color);
}

/* ---- add game ---- */
const toggleBtn = document.getElementById('addGameToggle');
const form = document.getElementById('addGameForm');
const nameInput = document.getElementById('newGameName');

toggleBtn.addEventListener('click', ()=>{
  form.classList.toggle('open');
  if(form.classList.contains('open')) nameInput.focus();
});
document.getElementById('addGameCancel').addEventListener('click', ()=>{
  form.classList.remove('open');
  nameInput.value='';
});
document.getElementById('addGameSubmit').addEventListener('click', submitNewGame);
nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitNewGame(); });

// フライアウトの外側をタップ/クリックしたら閉じる(1回だけ登録すればよい)
document.addEventListener('click', ()=>{
  document.querySelectorAll('.filter-flyout.open').forEach(el=>el.classList.remove('open'));
});

function submitNewGame(){
  const name = nameInput.value.trim();
  if(!name) return;
  const id = 'custom_' + Date.now();
  const color = NEW_GAME_COLORS[newGameCount % NEW_GAME_COLORS.length];
  const icon = ICON_KEYS[newGameCount % ICON_KEYS.length];
  newGameCount++;
  DATA[id] = {
    name: name, color: color, tagline: '', updated: '-', icon: icon,
    rosterLabel: 'キャラクター', roster: [], patches: []
  };
  current = id;
  nameInput.value = '';
  form.classList.remove('open');
  render();
}

/* ---- apex-data.json の自動取得(あれば取り込む。無ければ何も起きない) ---- */
function findRidByName(name){
  if(!name) return null;
  const g = DATA.apex;
  const r = g.roster.find(x => name.includes(x.name) || x.name.includes(name));
  if(r) return r.id;
  const w = g.weapons.find(x => name.includes(x.name) || x.name.includes(name));
  if(w) return w.id;
  return null; // 一致するキャラ/武器が見つからなければ null のまま(全体タイムラインには表示される)
}

const EVENT_KIND_STYLE = {
  "コラボ": {color:"#e2704f", icon:"hex"},
  "期間限定イベント": {color:"#e0ab58", icon:"orbit"},
  "中間アップデート": {color:"#5fa8d3", icon:"peak"},
  "リアルコラボ": {color:"#5fa8d3", icon:"diamond"},
  "リアル連動": {color:"#6fbf8b", icon:"peak"},
};
function styleForEventKind(kind){
  return EVENT_KIND_STYLE[kind] || {color:"#8b93a3", icon:"spark"};
}

async function loadRemotePatches(){
  try{
    const res = await fetch('apex-data.json', {cache:'no-store'});
    if(!res.ok) return; // ファイルがまだ無い場合などは静かに諦める
    const remote = await res.json();

    if(remote.patches && remote.patches.length){
      const converted = remote.patches.map(p => ({
        ver: (!p.ver || p.ver === '自動検知パッチ') ? '最新アップデート' : p.ver,
        date: p.date || '',
        title: '',
        lines: (p.lines || []).map(l => ({
          t: l.type,
          rid: findRidByName(l.target),
          target: l.target,
          text: l.text,
          mag: l.magnitude,
        })),
      }));
      // 自動取得分を一覧の先頭に追加する
      DATA.apex.patches = [...converted, ...DATA.apex.patches];
    }

    if(remote.events && remote.events.length){
      const existingNames = new Set(DATA.apex.events.map(e => e.name));
      const newEvents = remote.events
        .filter(e => e.name && !existingNames.has(e.name)) // 同じ名前のイベントは重複させない
        .map(e => {
          const style = styleForEventKind(e.kind);
          return {
            id: 'auto_' + (e.name || Math.random()),
            name: e.name,
            kind: e.kind || 'イベント',
            start: e.start || '',
            end: e.end || '',
            desc: e.desc || '',
            url: e.source || '',
            color: style.color,
            icon: style.icon,
          };
        });
      DATA.apex.events = [...newEvents, ...DATA.apex.events];
    }
  }catch(e){
    // オフライン・ローカルファイルとして開いている等で失敗しても、
    // 内蔵データでの表示を止めないようにする
    console.warn('apex-data.json の読み込みをスキップしました:', e);
  }
}

render();               // まずは内蔵データですぐ表示
loadRemotePatches().then(() => {
  if(current === 'apex') render();  // 追加データが取れたら、表示中なら更新する
});
</script>
